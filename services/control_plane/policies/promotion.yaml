quality_gates:
  # Demo tolerances, not statistical significance tests.
  min_auc: 0.65
  min_average_precision: 0.01
  min_evaluation_class_rows: 50

# Compare both models on the same held-out current transactions.
# Brier score measures probability error (lower is better). Require an actual
# improvement and guard against worse ranking; drift alone is not a reason to ship.
production_comparison:
  max_auc_drop: 0.01
  max_average_precision_drop: 0.01
  min_relative_brier_improvement: 0.02

# Absolute metric changes versus the same Production model on reference data.
# Alerts trigger evaluation; they do not bypass release quality gates.
monitoring_policy:
  critical_features: [transaction_amount, payment_attempts_1h, merchant_risk_score]
  min_labeled_rows: 100
  min_class_rows: 20
  max_metric_drop:
    precision: 0.10
    recall: 0.10
    auc: 0.05
  max_metric_increase:
    brier_score: 0.002
    calibration_error: 0.005
  max_fraud_rate_change: 0.002

drift_policy:
  on_none:
    action: noop
  on_low:
    action: noop
  on_medium:
    action: retrain_and_evaluate
  on_high:
    action: retrain_and_evaluate

release_policy:
  promote_if_quality_gates_pass: true
  promote_stage: Production
